name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build src/Lms.Api/Lms.Api.csproj --configuration Release
      - name: Test (includes migration drift check)
        run: dotnet test tests/Lms.Api.Tests/Lms.Api.Tests.csproj --configuration Release

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Lms.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Lms.Web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build src/Lms.Api/Lms.Api.csproj --configuration Release
      - name: Test (includes migration drift check)
        run: dotnet test tests/Lms.Api.Tests/Lms.Api.Tests.csproj --configuration Release

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Lms.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Lms.Web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    # Test-environment CD: only on pushes to main, only after the checks above pass.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-lms
      cancel-in-progress: false
    env:
      TAG: ${{ github.sha }}
      REMOTE: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      APP_DIR: kalash/lms
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' > ~/.ssh/config

      - name: Build images
        run: |
          docker build -f src/Lms.Api/Dockerfile -t lms-api:$TAG .
          docker build -t lms-web:$TAG src/Lms.Web

      - name: Ship images to server
        run: docker save lms-api:$TAG lms-web:$TAG | gzip | ssh $REMOTE 'gunzip | docker load'

      - name: Roll out
        run: |
          scp deploy/docker-compose.yml $REMOTE:$APP_DIR/docker-compose.yml
          ssh $REMOTE "cd $APP_DIR && sed -i '/^TAG=/d' .env && echo TAG=$TAG >> .env && docker compose up -d --wait --wait-timeout 180 --remove-orphans" \
            || { ssh $REMOTE "cd $APP_DIR && docker compose ps && docker compose logs --tail=80 api"; exit 1; }
          ssh $REMOTE "docker image prune -af --filter 'until=72h'"

# LMS test deployment. Lives on the server in ~/kalash/lms next to a .env file (see .env.example).
# The CD workflow copies this file there and runs:  TAG=<sha> docker compose up -d
name: lms

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: lms-api:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Test server runs in Development so the demo tenant, admin and sample data are seeded on start.
      ASPNETCORE_ENVIRONMENT: Development
      Seed__DevData__Enabled: "true"
      ConnectionStrings__Default: Host=db;Port=5432;Database=lms;Username=lms;Password=${DB_PASSWORD}
      Auth__SigningKey: ${AUTH_SIGNING_KEY:?set AUTH_SIGNING_KEY in .env}
      Platform__ProvisioningKey: ${PLATFORM_PROVISIONING_KEY:?set PLATFORM_PROVISIONING_KEY in .env}
      DataProtection__KeyStoragePath: /data/keys
      Storage__LocalRoot: /data/content-assets
      LiveClasses__FrontendBaseUrl: ${PUBLIC_URL}
      # The test server is reached by plain ws:// addresses (no domain or certificate yet); production must use wss://.
      Integrations__AllowInsecureLiveClassHosts: "true"
      Frontend__AllowedOrigins__0: ${PUBLIC_URL}
    volumes:
      - api-data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health/live HTTP/1.0\r\n\r\n\" >&3 && grep -q 200 <&3'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Live classes. Started only when COMPOSE_PROFILES=live is set in .env (see .env.example), so a server without LiveKit settings still deploys.
  # LIVEKIT_NODE_IP, LIVEKIT_API_KEY and LIVEKIT_API_SECRET must then be set in .env. Its address, key and secret are then entered in the app under Integrations -> Live classes: ws://<server ip>:7880.
  livekit:
    image: livekit/livekit-server:latest
    profiles: ["live"]
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          node_ip: ${LIVEKIT_NODE_IP:-127.0.0.1}
        keys:
          ${LIVEKIT_API_KEY:-unset}: ${LIVEKIT_API_SECRET:-unset-unset-unset-unset-unset-unset}
        webhook:
          api_key: ${LIVEKIT_API_KEY:-unset}
          urls:
            - http://api:8080/api/v1/integrations/livekit/webhook
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  web:
    image: lms-web:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8081}:80"

volumes:
  db-data:
  api-data:
